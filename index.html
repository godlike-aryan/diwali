<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Diwali - Family & Relatives</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🪔 Happy Diwali 🪔</h1>
        <p class="subtitle">Wishing you and your loved ones joy, health, and prosperity!</p>
        
        <!-- Interactive Diya Section -->
        <div class="diya-card" onclick="lightDiya()">
            <div id="flame" class="flame off"></div>
            <div class="diya-base"></div>
            <p id="diya-text">Click the Diya to Light It!</p>
        </div>

        <!-- Custom Greeting Form -->
        <div class="wish-box">
            <h3>Send a Family Greeting</h3>
            <input type="text" id="senderName" placeholder="Enter your name...">
            <button onclick="generateWish()">Create Wish</button>
            <p id="personalizedGreeting" class="greeting-output"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
